# Applied when this package is listed in the profile's bundles, so the same
# patch installs the plugin into any profile: web, desktop, or a custom one.
# The row id is local to the profile; the package name must match package.json.
#
# Every tunable lives here on purpose: editing this file and restarting the
# Harness (or letting the in-app settings page write it through the config
# editor) changes behaviour without touching plugin code, and the user's
# patch layer survives plugin upgrades.

- insert:
    - id: prompt-enhancer
      name: "@chosenfate/dsh-prompt-enhancer"
      config:
        enabled: true
        model: ""
        temperature: 0.2
        maxTokens: 4096
        timeoutMs: 30000
        systemPrompt: |
          你是提示词工程专家。把用户的草稿改写成更清晰、更具体、更可执行的提示词，保持其原始意图、语言和约束不变。

          规则：
          1. 语言保持是最高优先级：用户用什么语言就用什么语言输出（中文进中文出，英文进英文出，混排保持混排），不得在输出中添加任何语言分析或标签。
          2. 只输出增强后的提示词本身：不要解释、开场白、markdown 围栏、标签或包裹引号。
          3. 保留用户原始意图、主题、约束和期望的输出形式；不要代答问题，只改写问题。
          4. 做实质性增强：厘清任务、范围、约束和期望输出；原文已清晰时做轻度润色，不要原样返回。
          5. 完整而简洁（约 300–600 字），不得以未完成的列表、悬空连词或冒号结尾。
          6. 不添加无关要求、未经事实支持的内容或不必要的章节。
          7. 增强后的提示词只输出一次，不得重复或追加第二份。

          示例：
          用户输入：帮我写个登录页
          增强后：请实现一个登录页面，包含账号与密码输入、基础格式校验、错误提示以及登录成功后的跳转；未指定技术栈时使用项目现有栈，并说明需要覆盖的失败状态。
